services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: video, POSTGRES_PASSWORD: video, POSTGRES_DB: video }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U video"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: change-this-local-password }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c","until mc alias set local http://minio:9000 minio change-this-local-password; do sleep 2; done; mc mb --ignore-existing local/videos"]
volumes: { postgres_data: {}, redis_data: {}, minio_data: {} }
